<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Toolbox</title>
  <meta name="description" content="Small tools that run entirely on your device: developer helpers, images, colour, PDF, audio and video, calculators, codes and more.">
  <meta name="theme-color" content="#16120f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Toolbox">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preload" href="fonts/bricolage.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="css/images.css">
  <link rel="stylesheet" href="css/imagefx.css">
  <link rel="stylesheet" href="css/colour.css">
  <link rel="stylesheet" href="css/pdf.css">
  <link rel="stylesheet" href="css/audio.css">
  <link rel="stylesheet" href="css/video.css">
  <link rel="stylesheet" href="css/calc.css">
  <link rel="stylesheet" href="css/type.css">
  <link rel="stylesheet" href="css/codes.css">
  <script>
    try { const t = JSON.parse(localStorage.getItem('toolbox.theme')); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/"><span>The Toolbox</span></a>
    <label class="searchbox">
      <span id="search-icon" class="icon"></span>
      <input id="search" type="search" placeholder="Search tools…" autocomplete="off" spellcheck="false" aria-label="Search tools">
      <kbd>/</kbd>
    </label>
    <button id="theme" class="btn icon-btn" type="button"></button>
  </header>
  <div class="layout">
    <nav id="nav" class="sidebar" aria-label="All tools"></nav>
    <main id="main"></main>
  </div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
